<!doctype html>
<meta charset="utf-8">
<title>Episode 21 video inspection</title>
<style>html,body,video{margin:0;width:100%;height:100%;background:#111}video{object-fit:contain}</style>
<video id="v" controls muted playsinline></video>
<script>
const v=document.querySelector('#v');
v.src=new URLSearchParams(location.search).get('src');
window.videoInfo=()=>({duration:v.duration,videoWidth:v.videoWidth,videoHeight:v.videoHeight,readyState:v.readyState,currentTime:v.currentTime,hasAudio:v.webkitAudioDecodedByteCount>0});
</script>
